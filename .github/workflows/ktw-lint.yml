name: ktw-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ktw-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the commit of lint-v0.20.3.0 (what lint-latest pointed at); the tag pins action and linter together.
      - uses: oliver-zehentleitner/keep-the-why@2771046616a3c6bcd62916ed072f71feb5afd222  # lint-v0.20.3.0
        with:
          path: "."
          strict: "false"    # "true" turns warnings (e.g. missing Type on old entries) into failures
