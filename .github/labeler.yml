---
documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '**/*.md']
area:ci:
  - changed-files:
      - any-glob-to-any-file: .github/workflows/**
area:deps:
  - changed-files:
      - any-glob-to-any-file: ['Cargo.toml', 'Cargo.lock']
release:
  - head-branch: ['^release']
bug:
  - head-branch: ['^bugfix', '^bug/', '^fix/', '^hotfix']
github_actions:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', '.github/*labeler*.yml']
tests:
  - changed-files:
      - any-glob-to-any-file: tests/**
